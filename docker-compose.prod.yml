version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexus-postgres-prod
    environment:
      POSTGRES_DB: nexus_prod
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_secure_prod_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nexus-api-prod
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_URL: postgres://nexus:nexus_secure_prod_password@postgres:5432/nexus_prod
      WEB_ORIGIN: http://localhost:8080
      INGESTION_INTERVAL_MINUTES: 15
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: nexus-web-prod
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres_prod_data:
